; ECAPTURE.ini -- EvernightCapture user preference template
;
; HOW THIS FILE WORKS
;   Default location: ECAPTURE.ini in the SAME directory as the ECAPTURE.EXE you actually
;   run (installed copy, portable copy, and the build\ development binary all use this rule).
;   Nothing else is searched: not the current directory, not PATH, not a source tree, not the
;   registry, not another folder in your user profile.
;   Missing file is normal: built-in defaults apply and no file is written for you.
;   A file that exists but cannot be read, or that is not valid UTF-8 / not valid syntax,
;   is an error: the request fails BEFORE any window is picked, before any consent dialog and
;   before a single pixel is captured. It never quietly falls back to defaults and takes a
;   different kind of picture.
;
;   This file holds preferences only. It is not a way to say "capture this window now", and it
;   is not an authorization: with this file present, a bare `ECAPTURE` still takes no screenshot.
;
; PRIORITY
;   explicit command line  >  this file  >  built-in default
;   "Not written here" inherits the next level. A value written here that is invalid or unknown
;   is an error -- it is never treated as "absent".
;
; SYNTAX
;   UTF-8 (a leading BOM is allowed), CRLF or LF. Section and key names are ASCII,
;   case-insensitive, surrounding whitespace is ignored.
;   Comments must occupy a whole line (';' or '#'). Inline comments are NOT supported, because
;   a Windows path can contain ';' or '#' and silently truncating it is worse than an error.
;   A value may be wrapped in double quotes to keep leading/trailing spaces. Backslash is not an
;   escape character: C:\dir is two literal backslashes. No environment-variable expansion,
;   no command substitution, no includes, no network, no nested search.
;   Each section is written once; each key once. Unknown sections/keys are errors.
;
; SHAPE OF THIS FILE
;   Every setting below is written as a COMMENT (";key = value"), so this template is
;   documentation, not a decision: copying it to ECAPTURE.ini as-is leaves every setting at
;   its built-in default, exactly as if the file were absent. Remove the leading ";" on a
;   line to state that requirement yourself -- from that moment it is treated as an explicit
;   request (a written false / 0 / unset is still "explicitly written", see PRIORITY).
;   That is deliberate: a freshly deployed copy must behave byte-for-byte like a bare one.
;
; TROUBLESHOOTING
;   ECAPTURE --show-config          read-only view: which file was read, and which level each
;                                   effective setting came from (no pixels, no dialog, no files)
;   ECAPTURE --no-config ...         ignore this file completely for one run (does not delete it)
;   ECAPTURE --config C:\path\my.ini pick another file for one run
;   Localized guides: README.md / README.zh-CN.md / README.zh-TW.md / README.ja-JP.md
;   This tool never rewrites or repairs this file. Fix it yourself; back it up first.

[config]
; Format version of this file. Only 1 is understood. An unknown version is refused with the
; file path and the line number -- it is never "read as a compatible format anyway".
; version = 1

[general]
; language = auto | zh-CN | zh-TW | en | ja   (human text only; codes and field names are stable)
;   auto = follow the Windows display language; that is the factory default.
; language = auto
; verbosity = normal | quiet | verbose
;   quiet suppresses notes; verbose adds the "input" section and keeps notes. Written on the
;   command line the two are still mutually exclusive (--verbose wins, as documented).
;   CLI: -q / --quiet, -v / --verbose
; verbosity = normal

[capture]
; method = wgc | dwm | printwindow | bitblt | duplication | auto
;   which channel to acquire the picture from; all of them are implemented, they are not
;   interchangeable. CLI: --capture
; method = wgc
; cursor = unset | default | include | exclude
;   unset = make no request at all (the result then carries no cursor keys -- byte-for-byte the
;   behaviour from before this option). default = keep the channel default but report it.
;   include / exclude are real requirements and are honoured through the whole fallback chain:
;   a channel that cannot deliver them is taken out of the chain, or refused at parse time when
;   you named it explicitly. CLI: --cursor
; cursor = unset
; hdr = unset | auto | tonemap | refuse
;   unset = no request (no colour keys in the result). auto = keep the existing 8-bit path and
;   report what was verified. tonemap maps an HDR source back to 8-bit BT.709 sRGB;
;   refuse delivers nothing when the source is confirmed HDR. CLI: --hdr
; hdr = unset

[output]
; path = <filename template> | -
;   "-" means standard output and is what a bare run does anyway. A RELATIVE path here is
;   resolved against the directory of THIS file (not your current directory), and a fully
;   qualified path (C:\dir\x.png, \\server\share\x.png) is used as written. Two shapes are
;   refused instead of guessed, because their landing point belongs to whoever invoked this
;   rather than to this file: a drive-relative name (C:shot.png) and a leading single separator
;   without a drive (\shot.png, /shot.png). Placeholders are expanded per target: %i index,
;   %h hwnd, %p process id (0 for a screen target), %n window title, %d date, %t time.
;   The directory must already exist.
;   CLI: --out / -o (a relative CLI path stays relative to the caller's current directory)
; path = -
; format = auto | png | jpg | jpeg | bmp | tiff | gif
;   auto = keep inferring from the output name's extension; it does NOT switch that inference
;   off. Precedence: explicit CLI --format, then the extension of an explicit CLI --out, then
;   a non-auto format here, then the extension of the path above, then png.
;   Check the outcome with -v (input.format) and input.config.formatBasis. CLI: --format
; format = auto
; jpeg_quality = 1..100 (only used when the delivered format is jpeg). Keeping a value here is
;   a standing preference, so a non-jpeg run does not report anything about it; only an
;   --quality you typed on this command line gets a note when it cannot take effect. CLI: --quality
; jpeg_quality = 100
; overwrite = true | false
;   true = replace an existing file (factory default). false = never replace, which is what
;   --no-overwrite does on the command line. Only true / false are accepted: 1 / yes / on are not
;   a boolean here. CLI: --no-overwrite
; overwrite = true

[crop]
; mode = none | client-area | roi
;   none = deliver the whole window image. client-area = keep only the client area.
;   roi = keep the rectangle given by crop.roi below.
;   Coordinates are pixels of the delivered whole-window image itself (origin = its top-left),
;   physical pixels, NOT desktop absolute coordinates. Order is crop first, then scale.
;   A CLI --roi or --client-area replaces this whole group; --no-crop cancels it for one run.
; mode = none
; roi = x,y,width,height -- four decimal numbers, comma separated, no spaces and no sign.
;   x / y may be 0; width / height must be at least 1; none may exceed 16384.
;   A non-empty value must be syntactically valid even when mode is not roi; mode = roi without a
;   valid roi is an error and never falls back to "then deliver the whole window".
; roi =

[scale]
; Three independent ceilings, all shrink-only (never enlarge). 0 = that ceiling is not set.
; If all three are 0 there is no scaling at all and nothing claims an explicit scale.
; Interpolation is nearest neighbour. The result keys only appear when a scale really applied.
; CLI: --scale max-width=N,max-height=N,max-pixels=N ; --no-scale cancels this group once.
; max_width / max_height: 0..16384 (a side longer than a frame is not a request)
; max_width = 0
; max_height = 0
; max_pixels: 0..268435456 (= 16384 * 16384)
; max_pixels = 0

[timeouts]
; processing_ms = 0..86400000
;   One automatic budget for the whole request, shared by all its targets and retries
;   (matching, backend retries, frame waits, encoding, commit). 0 = no overall budget, while each
;   isolated call still keeps its built-in ceiling. Human thinking time is not part of it.
;   CLI: --timeout-ms
; processing_ms = 0
; consent_ms = 0..86400000
;   How long a real consent dialog may go unanswered. 0 = wait indefinitely. When it expires the
;   answer is treated as a REFUSAL -- a human timeout is never turned into consent, and this wait
;   is timed separately from the budget above. CLI: --consent-timeout-ms
; consent_ms = 0

[history]
; enabled = true | false
;   true (factory default): every image that was fully delivered also gets an independent copy
;   under history/YYYY-MM-DD/ next to the running executable, using the same encoded bytes
;   (no recapture, no re-encode, no hard link).
;   false: no new copy, and nothing is read or deleted either -- existing history is left alone.
;   Turning it off is a decision, not a failure: the result says history.status=disabled, which
;   is distinct from saved / skipped / failed. The root stays fixed at the program directory so
;   that moving this file can never turn into an accidental cleanup. CLI: --history on|off
; enabled = true

[notification]
; enabled = true | false
;   true (factory default): after an image has been fully delivered, one desktop notification is
;   handed to the Windows notification platform. false: nothing is handed over at all.
;   This switch changes the DISPLAY only. It never changes what is captured, never replaces the
;   consent dialog, and cannot make a capture succeed or fail: a notification that could not be
;   delivered leaves images[], errors[] and the exit code exactly as they were. Read the honest
;   outcome in the top-level "notification" object of the result (status=submitted does NOT prove
;   anything appeared on screen -- Focus assist and notification settings can hide it invisibly).
;   CLI: --notify on|off
; enabled = true
; merge = true | false
;   false (factory default): one notification per captured window/monitor, each with its own image.
;   true: one notification for the whole batch -- the headline counts the targets and the body
;   lists as many of them as the toast layout can actually show, with the remainder counted
;   instead of dropped silently. CLI: --notify-merge on|off
; merge = false
; detail = title | basic | minimal
;   HOW MUCH personal data leaves this process. Notification content lands in the system
;   notification centre, which is readable ON THE LOCK SCREEN, so the level is an explicit choice:
;     title   (factory default) + the window title itself
;     basic   no window title: owner process / handle and where the file went
;     minimal none of the above: only where the file went
;   The level never hides an error code, a raw value or a delivery fact -- those live in the
;   result JSON, which this switch does not touch. CLI: --notify-detail <level>
; detail = title
;
; THE PICTURE IN THE NOTIFICATION (no switch of its own, on purpose)
;   A notification carries an image only when this run actually has one to point at: it reuses
;   the history copy from [history] (images[].history.file) -- never the primary output, which may
;   be standard output, and never a file created for the notification.
;   So turning [history] enabled=false means notifications still arrive, WITHOUT a picture. That is
;   the documented consequence, not a failure: nothing is reported as an error for it, and the
;   text line then names the primary output instead. If history is on but that copy failed to
;   commit (history.status = failed / skipped), that one notification has no image either.

[diagnostics]
; integrity_hints = true | false
;   Controls only the EXTRA explanation text attached to "the system said no" failures (and the
;   matching note). It never hides an error code, a raw win32 / HRESULT value, a delivery fact,
;   or a capability field that --capabilities already reports -- and turning it off fixes no
;   permission. Do not read this switch as a repair. CLI: --integrity-hints on|off
; integrity_hints = true

[query]
; window_list_limit = 1..8192
;   The page size used by --list when the command line gave no --limit. It does not run a query
;   by itself, and an explicit --limit on the command line still wins.
;   Check the effective number in pagination.limit / pagination.limitSource of a --list result.
;   CLI: --limit
; window_list_limit = 50
